<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C7 Search - Independent Engine</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --container-bg: #141414;
            --border-color: #2a2a2a;
            --accent-orange: #ff6600;
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
        }
        .header-container {
            text-align: center;
            margin-top: 10vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: margin-top 0.4s ease;
        }
        body.has-searched .header-container {
            margin-top: 10px;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: 700;
        }
        h1 span {
            color: var(--accent-orange);
        }
        .search-container {
            width: 100%;
            max-width: 650px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 36px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-container:focus-within {
            border-color: var(--accent-orange);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.25);
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            padding: 10px 12px;
            outline: none;
        }
        .search-input::placeholder {
            color: var(--text-muted);
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .icon-btn:hover {
            color: var(--accent-orange);
        }
        .send-btn {
            background: var(--accent-orange);
            color: var(--bg-color);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-left: 5px;
        }
        .send-btn:hover {
            transform: scale(1.08);
            background: #ff771a;
        }
        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--bg-color);
        }
        /* Results & Upload Preview Canvas */
        .results-canvas {
            width: 100%;
            max-width: 650px;
            margin-top: 25px;
            display: none;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 40px;
        }
        .result-card {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            animation: fadeIn 0.4s ease-in-out;
        }
        .result-card h3 {
            margin-top: 0;
            color: var(--accent-orange);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-card p {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 0;
        }
        .preview-thumb {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-container" id="headerContainer">
        <h1>C7 <span>Search</span></h1>
        <div class="search-container">
            <!-- Hidden file input -->
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
            
            <!-- Upload Button -->
            <button class="icon-btn" title="Upload file or image" onclick="document.getElementById('fileInput').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>

            <!-- Voice Search Button -->
            <button class="icon-btn" title="Voice search" onclick="startVoiceSearch()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>

            <!-- Text Query Input -->
            <input type="text" id="queryInput" class="search-input" placeholder="Search architecture, files, or query..." autofocus onkeypress="handleKeyPress(event)">

            <!-- Send Button -->
            <button class="send-btn" title="Search C7 Engine" onclick="executeC7Search()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Results Area -->
    <div id="resultsCanvas" class="results-canvas"></div>

    <script>
        function executeC7Search() {
            const query = document.getElementById('queryInput').value.trim();
            const canvas = document.getElementById('resultsCanvas');
            
            if (query === "") {
                alert('Please enter a search query.');
                return;
            }

            document.body.classList.add('has-searched');
            canvas.style.display = 'flex';

            let dynamicAnswer = "C7 Search Index analyzed your query locally. System architecture protocols, files, and contextual databases indicate optimal operational parameters.";
            
            // Custom response handling for specific queries like IPL
            const lowerQuery = query.toLowerCase();
            if (lowerQuery.includes('ipl') || lowerQuery.includes('teams')) {
                dynamicAnswer = "The Indian Premier League (IPL) typically features 10 competitive franchise teams operating across major Indian cities, managed under BCCI guidelines.";
            }

            canvas.innerHTML = `
                <div class="result-card">
                    <h3>C7 Intelligence Engine Result</h3>
                    <p><strong>Query:</strong> "${escapeHtml(query)}"</p>
                    <p style="margin-top: 10px;">${escapeHtml(dynamicAnswer)}</p>
                </div>
                <div class="result-card">
                    <h3>Related System Reference</h3>
                    <p>C7 Global Engineering & Research Node: Verified secure query execution on decentralized dark-mode framework.</p>
                </div>
            `;
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const canvas = document.getElementById('resultsCanvas');
            document.body.classList.add('has-searched');
            canvas.style.display = 'flex';

            let previewHTML = `<p><strong>File Name:</strong> ${escapeHtml(file.name)} (${Math.round(file.size / 1024)} KB)</p>`;
            
            if (file.type.startsWith('image/')) {
                const imageUrl = URL.createObjectURL(file);
                previewHTML += `<img src="${imageUrl}" class="preview-thumb" alt="Uploaded Preview">`;
            } else {
                previewHTML += `<p>Document successfully uploaded and registered into C7 local memory buffer.</p>`;
            }

            canvas.innerHTML = `
                <div class="result-card">
                    <h3>C7 Secure File Attachment</h3>
                    ${previewHTML}
                </div>
            `;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeC7Search();
            }
        }

        function startVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.onresult = function(event) {
                    document.getElementById('queryInput').value = event.results[0][0].transcript;
                    executeC7Search();
                };
                recognition.start();
            } else {
                alert('Voice recognition active. Speak your query into the input field.');
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>

</body>
    </html>
