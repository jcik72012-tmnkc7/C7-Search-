    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C7 Search - Intelligence Engine</title>
    <style>
        :root {
            --bg-color: #080808;
            --surface-color: #121212;
            --border-color: #262626;
            --accent-orange: #ff6600;
            --accent-orange-glow: rgba(255, 102, 0, 0.25);
            --text-main: #f3f3f3;
            --text-muted: #888888;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .app-header {
            width: 100%;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        .logo-area h1 {
            font-size: 1.4rem;
            margin: 0;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--text-main);
        }
        .logo-area h1 span { color: var(--accent-orange); }
        
        /* Chat Stream Container */
        .chat-container {
            flex: 1;
            padding: 20px 20px 100px 20px; /* bottom padding so content isn't hidden behind input */
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }
        .hero-landing {
            margin: 40px auto;
            text-align: center;
            padding: 20px;
        }
        .hero-landing h2 {
            font-size: 2.3rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .hero-landing h2 span { color: var(--accent-orange); }
        .hero-landing p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Message Bubbles */
        .message-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.3s ease-out;
        }
        .message-row.user { align-items: flex-end; }
        .message-row.ai { align-items: flex-start; }
        
        .message-bubble {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px 22px;
            max-width: 90%;
            line-height: 1.7;
            white-space: pre-line;
            font-size: 1rem;
        }
        .message-row.user .message-bubble {
            background: rgba(255, 102, 0, 0.12);
            border-color: rgba(255, 102, 0, 0.3);
            color: var(--text-main);
        }
        .bubble-title {
            font-size: 0.8rem;
            color: var(--accent-orange);
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .preview-thumb {
            max-width: 100%;
            max-height: 220px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }
        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .action-btn:hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        /* Fixed Bottom Input Bar */
        .input-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(8, 8, 8, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            z-index: 200;
        }
        .input-wrapper {
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent-orange);
            box-shadow: 0 0 16px var(--accent-orange-glow);
        }
        .search-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            padding: 6px 4px;
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            font-family: inherit;
        }
        .search-textarea::placeholder { color: var(--text-muted); }
        .icon-btn, .send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover { color: var(--accent-orange); }
        .send-btn {
            background: var(--accent-orange);
            color: #000;
            border-radius: 50%;
            width: 36px;
            height: 36px;
        }
        .send-btn svg { width: 16px; height: 16px; fill: currentColor; }
        
        @media print {
            body { background: #fff; color: #000; }
            .app-header, .input-footer, .action-bar { display: none; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <a class="logo-area" href="javascript:location.reload()">
            <h1>C7 <span>Search</span></h1>
        </a>
        <button class="action-btn" onclick="location.reload()">New Chat ➕</button>
    </header>

    <!-- Scrollable Chat Stream Container -->
    <div id="chatContainer" class="chat-container">
        <div id="heroLanding" class="hero-landing">
            <h2>C7 <span>Intelligence Engine</span></h2>
            <p>Ask anything, upload documents, search files, and converse naturally with continuous history.</p>
        </div>
    </div>

    <!-- Fixed Bottom Input Footer -->
    <footer class="input-footer">
        <div class="input-wrapper">
            <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx" style="display: none;" onchange="handleFileSelection(event)">
            <button class="icon-btn" title="Upload file or take photo" onclick="document.getElementById('fileInput').click()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button class="icon-btn" title="Voice search" onclick="startVoiceSearch()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
            <textarea id="queryInput" class="search-textarea" placeholder="Ask C7 Search anything..." rows="1" oninput="autoResize(this)" onkeypress="handleKeyPress(event)"></textarea>
            <button class="send-btn" title="Send" onclick="executeC7Search()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </footer>

    <script>
        let attachedFilePayload = null;
        let attachedFileMime = null;
        let attachedFileName = null;
        let stagedImagePreviewUrl = null;

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        function handleFileSelection(event) {
            const file = event.target.files[0];
            if (!file) return;

            attachedFileName = file.name;
            attachedFileMime = file.type;

            const reader = new FileReader();
            reader.onload = function(e) {
                attachedFilePayload = e.target.result.split(',')[1];
                stagedImagePreviewUrl = file.type.startsWith('image/') ? e.target.result : null;
                document.getElementById('queryInput').placeholder = `File attached: ${file.name}. Type your command...`;
            };
            reader.readAsDataURL(file);
        }

        async function executeC7Search() {
            const queryInput = document.getElementById('queryInput');
            const query = queryInput.value.trim();
            const chatContainer = document.getElementById('chatContainer');
            const hero = document.getElementById('heroLanding');

            if (query === "" && !attachedFilePayload) {
                return;
            }

            if (hero) hero.style.display = 'none';

            let userHTML = `<div class="bubble-title">You</div><p>${escapeHtml(query || "Analyze attached document.")}</p>`;
            if (stagedImagePreviewUrl) {
                userHTML += `<img src="${stagedImagePreviewUrl}" class="preview-thumb" alt="Attached">`;
            } else if (attachedFileName) {
                userHTML += `<div style="margin-top:8px; font-size:0.85rem; color:var(--accent-orange);">📎 Attached: ${escapeHtml(attachedFileName)}</div>`;
            }

            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="message-bubble">${userHTML}</div>`;
            chatContainer.appendChild(userRow);

            queryInput.value = '';
            queryInput.style.height = 'auto';
            queryInput.placeholder = 'Ask C7 Search anything...';

            const currentFilePayload = attachedFilePayload;
            const currentFileMime = attachedFileMime;
            const currentFileName = attachedFileName;

            attachedFilePayload = null;
            attachedFileMime = null;
            attachedFileName = null;
            stagedImagePreviewUrl = null;

            const aiRow = document.createElement('div');
            aiRow.className = 'message-row ai';
            aiRow.innerHTML = `
                <div class="message-bubble">
                    <div class="bubble-title">C7 Intelligence Engine</div>
                    <p style="color: var(--accent-orange);">Synthesizing secure response...</p>
                </div>
            `;
            chatContainer.appendChild(aiRow);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch('https://c7-search-1.onrender.com/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        query: query,
                        fileData: currentFilePayload,
                        mimeType: currentFileMime
                    })
                });

                const data = await response.json();

                if (data.success) {
                    aiRow.innerHTML = `
                        <div class="message-bubble">
                            <div class="bubble-title">C7 Executive Synthesis</div>
                            ${currentFileName ? `<div style="margin-bottom:8px; font-size:0.85rem; color:var(--accent-orange);">Source: ${escapeHtml(currentFileName)}</div>` : ''}
                            <p>${escapeHtml(data.answer)}</p>
                            <div class="action-bar">
                                <button class="action-btn" onclick="window.print()">📥 Save / Print as PDF</button>
                                <button class="action-btn" onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText); alert('Copied to clipboard!');">📋 Copy</button>
                            </div>
                            <p style="margin-top: 12px; font-size: 0.8rem; color: var(--text-muted);">Processed via: ${escapeHtml(data.node)}</p>
                        </div>
                    `;
                } else {
                    aiRow.innerHTML = `
                        <div class="message-bubble">
                            <div class="bubble-title">C7 Engine Notice</div>
                            <p style="color: #ff4444;">${escapeHtml(data.error || 'Synthesis failed.')}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Connection Error:', error);
                aiRow.innerHTML = `
                    <div class="message-bubble">
                        <div class="bubble-title">Connection Notice</div>
                        <p style="color: #ff4444;">Could not reach C7 Render backend server.</p>
                    </div>
                `;
            }
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function startVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.onresult = function(event) {
                    document.getElementById('queryInput').value = event.results[0][0].transcript;
                    autoResize(document.getElementById('queryInput'));
                    executeC7Search();
                };
                recognition.start();
            } else {
                alert('Voice transcription initializing. Please speak clearly.');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                executeC7Search();
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
                </html>
