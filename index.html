   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C7 Search - Intelligence Engine</title>
    <style>
        :root {
            --bg-color: #080808;
            --surface-color: #121212;
            --border-color: #262626;
            --accent-orange: #ff6600;
            --accent-orange-glow: rgba(255, 102, 0, 0.2);
            --text-main: #f3f3f3;
            --text-muted: #888888;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .app-header {
            width: 100%;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        .logo-area h1 {
            font-size: 1.6rem;
            margin: 0;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--text-main);
        }
        .logo-area h1 span { color: var(--accent-orange); }
        .search-container {
            width: 100%;
            max-width: 720px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-container:focus-within {
            border-color: var(--accent-orange);
            box-shadow: 0 0 16px var(--accent-orange-glow);
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.98rem;
            padding: 8px 10px;
            outline: none;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .icon-btn, .send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .icon-btn:hover { color: var(--accent-orange); }
        .send-btn {
            background: var(--accent-orange);
            color: #000;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            margin-left: 6px;
        }
        .send-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .hero-landing {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .hero-landing h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .hero-landing h2 span { color: var(--accent-orange); }
        .hero-landing p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
        }
        .results-canvas {
            display: none;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }
        .result-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            animation: fadeIn 0.4s ease-out;
        }
        .result-card h3 {
            margin-top: 0;
            color: var(--accent-orange);
            font-size: 1.2rem;
        }
        .result-card p {
            line-height: 1.7;
            margin-bottom: 0;
            white-space: pre-line;
        }
        .preview-thumb {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 12px;
            border: 1px solid var(--border-color);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <a class="logo-area" href="javascript:location.reload()">
            <h1>C7 <span>Search</span></h1>
        </a>
        <div class="search-container">
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
            <button class="icon-btn" title="Upload file or image" onclick="document.getElementById('fileInput').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button class="icon-btn" title="Voice search" onclick="startVoiceSearch()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
            <input type="text" id="queryInput" class="search-input" placeholder="Ask C7 Search anything..." autofocus onkeypress="handleKeyPress(event)">
            <button class="send-btn" title="Search" onclick="executeC7Search()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </header>

    <div id="heroLanding" class="hero-landing">
        <h2>C7 <span>Intelligence Engine</span></h2>
        <p>Advanced AI search combining deep reasoning, file analysis, and real-time synthesis.</p>
    </div>

    <div id="resultsCanvas" class="results-canvas"></div>

    <script>
        async function executeC7Search() {
            const query = document.getElementById('queryInput').value.trim();
            const canvas = document.getElementById('resultsCanvas');
            const hero = document.getElementById('heroLanding');
            
            if (query === "") {
                alert('Please enter a search query.');
                return;
            }

            hero.style.display = 'none';
            canvas.style.display = 'flex';

            canvas.innerHTML = `
                <div class="result-card">
                    <h3>C7 Intelligence Engine is synthesizing...</h3>
                    <p style="color: var(--accent-orange);">Gathering deep insights across neural networks...</p>
                </div>
            `;

            try {
                const response = await fetch('https://c7-search-1.onrender.com/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();

                if (data.success) {
                    canvas.innerHTML = `
                        <div class="result-card">
                            <h3>C7 Executive Synthesis</h3>
                            <p>${escapeHtml(data.answer)}</p>
                            <p style="margin-top: 15px; font-size: 0.85rem; color: var(--text-muted);">Processed via: ${escapeHtml(data.node)}</p>
                        </div>
                    `;
                } else {
                    canvas.innerHTML = `
                        <div class="result-card">
                            <h3>C7 Engine Error</h3>
                            <p style="color: #ff4444;">${escapeHtml(data.error || 'Synthesis failed.')}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Connection Error:', error);
                canvas.innerHTML = `
                    <div class="result-card">
                        <h3>Connection Failed</h3>
                        <p style="color: #ff4444;">Could not reach the C7 Render backend server.</p>
                    </div>
                `;
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const canvas = document.getElementById('resultsCanvas');
            const hero = document.getElementById('heroLanding');
            hero.style.display = 'none';
            canvas.style.display = 'flex';

            let previewHTML = `<p><strong>File Attached:</strong> ${escapeHtml(file.name)} (${Math.round(file.size / 1024)} KB)</p>`;
            if (file.type.startsWith('image/')) {
                const imageUrl = URL.createObjectURL(file);
                previewHTML += `<img src="${imageUrl}" class="preview-thumb" alt="Uploaded Preview">`;
                previewHTML += `<p style="margin-top:10px; color:var(--accent-orange);"><strong>C7 Vision:</strong> Image successfully loaded into workspace memory.</p>`;
            } else {
                previewHTML += `<p style="margin-top:10px; color:var(--accent-orange);"><strong>C7 Document Parser:</strong> File indexed securely.</p>`;
            }

            canvas.innerHTML = `<div class="result-card"><h3>C7 Attachment Analysis</h3>${previewHTML}</div>`;
        }

        function startVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.onresult = function(event) {
                    document.getElementById('queryInput').value = event.results[0][0].transcript;
                    executeC7Search();
                };
                recognition.start();
            } else {
                alert('Voice recognition is initializing. Speak your query clearly.');
            }
        }

        function handleKeyPress(event) { if (event.key === 'Enter') executeC7Search(); }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
